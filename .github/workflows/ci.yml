name: CI

on: [push, pull_request]

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2
        run: |
          set -euxo pipefail
          GODOT_VERSION="4.7.2-stable"
          ASSET="Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          curl -fSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/${ASSET}"
          sudo unzip -o /tmp/godot.zip -d /usr/local/bin
          sudo mv /usr/local/bin/Godot_v${GODOT_VERSION}_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          rm /tmp/godot.zip
          godot --version

      - name: Check version
        run: |
          set -euxo pipefail
          godot --headless --version | tee /tmp/godot_version.txt
          grep -q "4\.7\." /tmp/godot_version.txt

      - name: Import
        timeout-minutes: 5
        run: godot --headless --path . --import

      - name: Run headless tests
        timeout-minutes: 5
        run: godot --headless --path . --script res://tests/test_runner.gd

      - name: Probe dev server
        timeout-minutes: 5
        run: |
          set -euxo pipefail
          godot --headless --path . > /tmp/godot_server.log 2>&1 &
          SERVER_PID=$!
          cleanup() { kill "$SERVER_PID" 2>/dev/null || true; }
          trap cleanup EXIT
          for i in $(seq 1 30); do
            if python3 -c "import socket; socket.create_connection(('127.0.0.1', 9080), timeout=1).close()" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          python3 tests/ws_probe.py --ping
          CREATE_OUT=$(python3 tests/ws_probe.py --create --name Host)
          echo "$CREATE_OUT"
          echo "$CREATE_OUT" | grep -q "^code="
          echo "$CREATE_OUT" | grep -q "^token="
          CODE=$(echo "$CREATE_OUT" | sed -n 's/^code=//p' | tr -d '\r\n ')
          TOKEN=$(echo "$CREATE_OUT" | sed -n 's/^token=//p' | tr -d '\r\n ')
          test -n "$CODE"
          test -n "$TOKEN"
          JOIN_OUT=$(python3 tests/ws_probe.py --join "$CODE" --name Guest)
          echo "$JOIN_OUT"
          echo "$JOIN_OUT" | grep -q "seats=2"
          BAD_OUT=$(python3 tests/ws_probe.py --join ZZZZ --name X 2>&1 || true)
          echo "$BAD_OUT"
          echo "$BAD_OUT" | grep -q "error=NO_ROOM"
          if python3 tests/ws_probe.py --join ZZZZ --name X; then
            echo "bad-code join unexpectedly succeeded"
            exit 1
          fi
          # Server-game binding: private racks, authoritative intents, timers.
          TROOM_OUT=$(python3 tests/ws_probe.py --create --test-mode --name Host)
          echo "$TROOM_OUT"
          TCODE=$(echo "$TROOM_OUT" | sed -n 's/^code=//p' | tr -d '\r\n ')
          TTOKEN=$(echo "$TROOM_OUT" | sed -n 's/^token=//p' | tr -d '\r\n ')
          test -n "$TCODE"
          test -n "$TTOKEN"
          TJOIN_OUT=$(python3 tests/ws_probe.py --join "$TCODE" --name Guest)
          echo "$TJOIN_OUT"
          GTOKEN=$(echo "$TJOIN_OUT" | sed -n 's/^token=//p' | tr -d '\r\n ')
          test -n "$GTOKEN"
          python3 tests/ws_probe.py --start --code "$TCODE" --token "$TTOKEN" | grep -q "started=true"
          python3 tests/ws_probe.py --debug-rack "0:ZZQJXEF" --code "$TCODE" --token "$TTOKEN" | grep -q "rack=ZZQJXEF"
          python3 tests/ws_probe.py --debug-rack "1:CATDEFG" --code "$TCODE" --token "$TTOKEN" | grep -q "rack=CATDEFG"
          PRIV_OUT=$(python3 tests/ws_probe.py --check-private "$TCODE" "$TTOKEN" "$GTOKEN")
          echo "$PRIV_OUT"
          echo "$PRIV_OUT" | grep -q "racks_private=true"
          if BAD_OUT=$(python3 tests/ws_probe.py --place-tiles --code "$TCODE" --token "$TTOKEN" --tiles '[{"square":"F8","letter":"Z"},{"square":"G8","letter":"Z"},{"square":"H8","letter":"Q"},{"square":"I8","letter":"J"},{"square":"J8","letter":"X"}]' 2>&1); then
            echo "illegal word unexpectedly accepted"
            exit 1
          fi
          echo "$BAD_OUT"
          echo "$BAD_OUT" | grep -q "accepted=false"
          echo "$BAD_OUT" | grep -q "reason=NOT_IN_LEXICON"
          python3 tests/ws_probe.py --rpc "{\"v\":1,\"m\":\"recall\",\"code\":\"$TCODE\",\"token\":\"$TTOKEN\"}" | grep -q "ok=true"
          python3 tests/ws_probe.py --debug-rack "0:CATDEFG" --code "$TCODE" --token "$TTOKEN" >/dev/null
          CAT_OUT=$(python3 tests/ws_probe.py --place-tiles --code "$TCODE" --token "$TTOKEN" --tiles '[{"square":"G8","letter":"C"},{"square":"H8","letter":"A"},{"square":"I8","letter":"T"}]')
          echo "$CAT_OUT"
          echo "$CAT_OUT" | grep -q "accepted=true"
          echo "$CAT_OUT" | grep -q "points="
          LONG=$(python3 -c "print('q'*250)")
          CHAT_OUT=$(python3 tests/ws_probe.py --rpc "{\"v\":1,\"m\":\"chat\",\"code\":\"$TCODE\",\"token\":\"$TTOKEN\",\"text\":\"$LONG\"}")
          echo "$CHAT_OUT" | grep -q "chat_ok=true"
          echo "$CHAT_OUT" | python3 -c "import sys,json; d=json.loads([l for l in sys.stdin.read().splitlines() if l.startswith('json=')][0][5:]); assert len(d['text'])==200, len(d['text']); print('chat_len=200')"
          SROOM_OUT=$(python3 tests/ws_probe.py --create --test-mode --turn-secs 1 --name Host)
          SCODE=$(echo "$SROOM_OUT" | sed -n 's/^code=//p' | tr -d '\r\n ')
          STOKEN=$(echo "$SROOM_OUT" | sed -n 's/^token=//p' | tr -d '\r\n ')
          SJOIN_OUT=$(python3 tests/ws_probe.py --join "$SCODE" --name Guest)
          SGTOKEN=$(echo "$SJOIN_OUT" | sed -n 's/^token=//p' | tr -d '\r\n ')
          test -n "$SGTOKEN"
          python3 tests/ws_probe.py --start --code "$SCODE" --token "$STOKEN" | grep -q "started=true"
          LISTEN_OUT=$(python3 tests/ws_probe.py --listen 4 --code "$SCODE" --token "$SGTOKEN")
          echo "$LISTEN_OUT"
          echo "$LISTEN_OUT" | grep -q "auto_pass=true"
          # Reconnect: strict token rejoin with a full-state resync snapshot.
          RJROOM_OUT=$(python3 tests/ws_probe.py --create --test-mode --name Host)
          RJCODE=$(echo "$RJROOM_OUT" | sed -n 's/^code=//p' | tr -d '\r\n ')
          RJTOKEN=$(echo "$RJROOM_OUT" | sed -n 's/^token=//p' | tr -d '\r\n ')
          test -n "$RJCODE"
          test -n "$RJTOKEN"
          python3 tests/ws_probe.py --join "$RJCODE" --name Guest >/dev/null
          python3 tests/ws_probe.py --start --code "$RJCODE" --token "$RJTOKEN" | grep -q "started=true"
          python3 tests/ws_probe.py --debug-rack "0:CATDEFG" --code "$RJCODE" --token "$RJTOKEN" >/dev/null
          python3 tests/ws_probe.py --place-tiles --code "$RJCODE" --token "$RJTOKEN" --tiles '[{"square":"G8","letter":"C"},{"square":"H8","letter":"A"},{"square":"I8","letter":"T"}]' | grep -q "accepted=true"
          RJ_OK=$(python3 tests/ws_probe.py --rejoin --code "$RJCODE" --token "$RJTOKEN")
          echo "$RJ_OK"
          echo "$RJ_OK" | grep -q "resync_ms="
          echo "$RJ_OK" | grep -q "board_tiles=3"
          echo "$RJ_OK" | grep -q "started=true"
          RJBAD_OUT=$(python3 tests/ws_probe.py --rejoin --code "$RJCODE" --token "00000000000000000000000000000000" 2>&1 || true)
          echo "$RJBAD_OUT"
          echo "$RJBAD_OUT" | grep -q "error=BAD_TOKEN"
          if python3 tests/ws_probe.py --rejoin --code "$RJCODE" --token "00000000000000000000000000000000"; then
            echo "wrong-token rejoin unexpectedly succeeded"
            exit 1
          fi

      - name: Net client suite
        timeout-minutes: 5
        run: |
          set -euxo pipefail
          godot --headless --path . > /tmp/godot_net_server.log 2>&1 &
          SERVER_PID=$!
          cleanup() { kill "$SERVER_PID" 2>/dev/null || true; }
          trap cleanup EXIT
          for i in $(seq 1 30); do
            if python3 -c "import socket; socket.create_connection(('127.0.0.1', 9080), timeout=1).close()" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          godot --headless --path . --script res://tests/test_runner.gd --suite net_client 2>&1 | tee /tmp/net_client.log
          grep -q "sync_racks=2" /tmp/net_client.log
          grep -q "ui_reject=Not in my book:" /tmp/net_client.log
          grep -q "chat_relay=true" /tmp/net_client.log

      - name: Reconnect suite
        timeout-minutes: 5
        run: |
          set -euxo pipefail
          godot --headless --path . > /tmp/godot_reconnect_server.log 2>&1 &
          SERVER_PID=$!
          cleanup() { kill "$SERVER_PID" 2>/dev/null || true; }
          trap cleanup EXIT
          for i in $(seq 1 30); do
            if python3 -c "import socket; socket.create_connection(('127.0.0.1', 9080), timeout=1).close()" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          godot --headless --path . --script res://tests/test_runner.gd --suite reconnect 2>&1 | tee /tmp/reconnect.log
          grep -q "overlay=Reconnecting" /tmp/reconnect.log
          grep -q "resync_identical=true" /tmp/reconnect.log
          grep -q "error=BAD_TOKEN" /tmp/reconnect.log

      - name: Dump server log on failure
        if: failure()
        timeout-minutes: 5
        run: |
          set -euxo pipefail
          if [ -f /tmp/godot_server.log ]; then
            cat /tmp/godot_server.log || true
          else
            echo "server log not found: /tmp/godot_server.log"
          fi
          if [ -f /tmp/godot_net_server.log ]; then
            cat /tmp/godot_net_server.log || true
          fi
          if [ -f /tmp/net_client.log ]; then
            cat /tmp/net_client.log || true
          fi
          if [ -f /tmp/godot_reconnect_server.log ]; then
            cat /tmp/godot_reconnect_server.log || true
          fi
          if [ -f /tmp/reconnect.log ]; then
            cat /tmp/reconnect.log || true
          fi

  network-smoke:
    name: Network smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2
        run: |
          set -euxo pipefail
          GODOT_VERSION="4.7.2-stable"
          ASSET="Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          curl -fSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/${ASSET}"
          sudo unzip -o /tmp/godot.zip -d /usr/local/bin
          sudo mv /usr/local/bin/Godot_v${GODOT_VERSION}_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          rm /tmp/godot.zip
          godot --version

      - name: Import
        timeout-minutes: 5
        run: godot --headless --path . --import

      - name: Two clients, forced drop, full legit game
        timeout-minutes: 5
        run: |
          set -euxo pipefail
          godot --headless --path . > /tmp/godot_smoke_server.log 2>&1 &
          SERVER_PID=$!
          cleanup() { kill "$SERVER_PID" 2>/dev/null || true; }
          trap cleanup EXIT
          for i in $(seq 1 30); do
            if python3 -c "import socket; socket.create_connection(('127.0.0.1', 9080), timeout=1).close()" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          godot --headless -s tests/net_smoke.gd | tee /tmp/net_smoke.log
          grep -q "smoke_game_over=true" /tmp/net_smoke.log
          grep -q "smoke_resync=true" /tmp/net_smoke.log
          grep -q "illegal_states=0" /tmp/net_smoke.log
          python3 tests/ws_probe.py --smoke | tee /tmp/ws_smoke.log
          grep -q "smoke_game_over=true" /tmp/ws_smoke.log
          grep -q "smoke_resync=true" /tmp/ws_smoke.log
          grep -q "illegal_states=0" /tmp/ws_smoke.log

      - name: Dump smoke logs on failure
        if: failure()
        timeout-minutes: 5
        run: |
          set -euxo pipefail
          if [ -f /tmp/godot_smoke_server.log ]; then
            cat /tmp/godot_smoke_server.log || true
          else
            echo "server log not found: /tmp/godot_smoke_server.log"
          fi
          if [ -f /tmp/net_smoke.log ]; then
            cat /tmp/net_smoke.log || true
          else
            echo "smoke log not found: /tmp/net_smoke.log"
          fi
          if [ -f /tmp/ws_smoke.log ]; then
            cat /tmp/ws_smoke.log || true
          else
            echo "smoke log not found: /tmp/ws_smoke.log"
          fi
