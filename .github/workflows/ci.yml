name: CI

on: [push, pull_request]

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2
        run: |
          set -euxo pipefail
          GODOT_VERSION="4.7.2-stable"
          ASSET="Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          curl -fSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/${ASSET}"
          sudo unzip -o /tmp/godot.zip -d /usr/local/bin
          sudo mv /usr/local/bin/Godot_v${GODOT_VERSION}_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          rm /tmp/godot.zip
          godot --version

      - name: Check version
        run: |
          set -euxo pipefail
          godot --headless --version | tee /tmp/godot_version.txt
          grep -q "4\.7\." /tmp/godot_version.txt

      - name: Import
        timeout-minutes: 5
        run: godot --headless --path . --import

      - name: Run headless tests
        timeout-minutes: 5
        run: godot --headless --path . --script res://tests/test_runner.gd

      - name: Probe dev server
        timeout-minutes: 5
        run: |
          set -euxo pipefail
          godot --headless --path . > /tmp/godot_server.log 2>&1 &
          SERVER_PID=$!
          cleanup() { kill "$SERVER_PID" 2>/dev/null || true; }
          trap cleanup EXIT
          for i in $(seq 1 30); do
            if python3 -c "import socket; socket.create_connection(('127.0.0.1', 9080), timeout=1).close()" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          python3 tests/ws_probe.py --ping
          CREATE_OUT=$(python3 tests/ws_probe.py --create --name Host)
          echo "$CREATE_OUT"
          echo "$CREATE_OUT" | grep -q "^code="
          echo "$CREATE_OUT" | grep -q "^token="
          CODE=$(echo "$CREATE_OUT" | sed -n 's/^code=//p' | tr -d '\r\n ')
          TOKEN=$(echo "$CREATE_OUT" | sed -n 's/^token=//p' | tr -d '\r\n ')
          test -n "$CODE"
          test -n "$TOKEN"
          JOIN_OUT=$(python3 tests/ws_probe.py --join "$CODE" --name Guest)
          echo "$JOIN_OUT"
          echo "$JOIN_OUT" | grep -q "seats=2"
          BAD_OUT=$(python3 tests/ws_probe.py --join ZZZZ --name X 2>&1 || true)
          echo "$BAD_OUT"
          echo "$BAD_OUT" | grep -q "error=NO_ROOM"
          if python3 tests/ws_probe.py --join ZZZZ --name X; then
            echo "bad-code join unexpectedly succeeded"
            exit 1
          fi

      - name: Dump server log on failure
        if: failure()
        timeout-minutes: 5
        run: |
          set -euxo pipefail
          if [ -f /tmp/godot_server.log ]; then
            cat /tmp/godot_server.log || true
          else
            echo "server log not found: /tmp/godot_server.log"
          fi
